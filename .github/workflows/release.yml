name: Release
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon, which covers modern Macs. The Intel
        # runner (macos-13) is being retired by GitHub and frequently fails
        # to allocate, so it's intentionally omitted.
        platform: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf curl unzip

      - name: macOS fetch tools
        if: runner.os == 'macOS'
        run: brew install curl unzip xz

      - name: Fetch FFmpeg sidecar
        shell: bash
        # `host` lets the fetch script pick the correct target for the
        # runner (win-x86_64, mac-arm64/x86_64, or linux-x86_64).
        run: npm run fetch-ffmpeg

      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: pdf2vid v__VERSION__
          releaseDraft: true
          prerelease: false

  ci:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Build matrix result: ${{ needs.build.result }}"
      - if: needs.build.result != 'success'
        run: |
          echo "One or more platform builds failed"
          exit 1