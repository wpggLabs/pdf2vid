name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint & format (Biome)
        run: npm run ci:lint
      - name: Unit tests + coverage
        run: npm run test:coverage
      - name: Type-check & build
        run: npm run build

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf fonts-dejavu-core
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: macOS fetch tools
        if: runner.os == 'macOS'
        run: brew install curl unzip xz
      - name: Fetch FFmpeg sidecar
        # tauri.conf.json declares bundle.externalBin, so build.rs fails
        # unless these binaries are present under src-tauri/binaries/ even
        # for `cargo build`/`test`, not just release packaging.
        shell: bash
        run: node scripts/fetch-ffmpeg.js host
      - name: Rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --lib --bins --tests -- -D warnings
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Install FFmpeg (integration tests)
        # setup-ffmpeg only ships x64 builds, so arm64 macOS uses Homebrew.
        if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@v3
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Integration tests (real PDF fixtures + FFmpeg render)
        # The pipeline tests are #[ignore]d so local `cargo test` stays
        # fast; CI opts in with FFmpeg installed. Tests that need deps CI
        # lacks (e.g. edge-tts network TTS) self-skip with a printed reason.
        run: cargo test --manifest-path src-tauri/Cargo.toml --tests -- --ignored --nocapture

  supply-chain:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny (advisories, bans, sources, licenses)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories bans sources licenses
