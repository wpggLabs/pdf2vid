[package]
name = "pdf2vid"
version = "0.1.0"
description = "Professional local-first PDF to video studio"
authors = ["wpggLabs"]
license = "MIT"
edition = "2021"

[lib]
name = "pdf2vid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
futures = "0.3"
futures-util = "0.3"
url = "2"
once_cell = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rand = "0.8"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `pdf-extract` is a development-only dependency used by the
# `tests/pdf_pipeline.rs` integration test to parse real PDF fixtures
# without going through the JS runtime. Production PDF parsing still
# runs in the frontend via `pdfjs-dist`.
pdf-extract = "0.10"

[[example]]
name = "smoke"
path = "examples/smoke.rs"
