# cargo-deny configuration — supply-chain gate for the Rust crate.
# Run locally with:  cargo deny --manifest-path src-tauri/Cargo.toml check
# Docs: https://embarkstudios.github.io/cargo-deny/

[advisories]
# RustSec advisory database. Known vulnerabilities in our own dependency
# tree fail the build; yanked crates warn.
version = 2
yanked = "warn"
# Advisories in transitive crates we do not control. Two sources:
#   * The GTK3 stack that Tauri requires for the Linux webview (gtk-rs and
#     friends are unmaintained but have no upstream replacement yet).
#   * The dev-only `pdf-extract` fixture parser used by the ignored
#     integration tests (lopdf, ttf-parser, unic-*, quick-xml) — it never
#     runs in the shipped app.
# Tracked for upstream upgrades; revisit when Tauri moves off GTK3.
ignore = [
  "RUSTSEC-2024-0370",
  "RUSTSEC-2024-0411",
  "RUSTSEC-2024-0412",
  "RUSTSEC-2024-0413",
  "RUSTSEC-2024-0414",
  "RUSTSEC-2024-0415",
  "RUSTSEC-2024-0416",
  "RUSTSEC-2024-0417",
  "RUSTSEC-2024-0418",
  "RUSTSEC-2024-0419",
  "RUSTSEC-2024-0420",
  "RUSTSEC-2025-0075",
  "RUSTSEC-2025-0080",
  "RUSTSEC-2025-0081",
  "RUSTSEC-2025-0098",
  "RUSTSEC-2025-0100",
  "RUSTSEC-2026-0187",
  "RUSTSEC-2026-0192",
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]

[bans]
# Multiple versions of the same crate bloat the binary but are common in
# large dependency trees (Tauri pulls a lot in), so warn rather than deny.
multiple-versions = "warn"
wildcards = "warn"
# Deny crates known to be problematic; add entries as needed, e.g.
# deny = [{ name = "openssl-sys" }]
deny = []

[sources]
# Only allow crates from the canonical registry / trusted git sources.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
# Permit the standard permissive licenses used across the Rust ecosystem.
# A dependency under anything not listed here will fail the build so a
# human can review the license before it ships.
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "OpenSSL",
  "BSL-1.0",
]
confidence-threshold = 0.9
