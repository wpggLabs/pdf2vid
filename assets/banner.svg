<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="pdf2vid — turn PDFs into narrated read-along videos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#131824"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc131"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#6ea8fe" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6ea8fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20283a"/>
      <stop offset="1" stop-color="#161c29"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#brand)"/>

  <!-- Wordmark + tagline + chips -->
  <g transform="translate(72, 96)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="0" y="66" font-size="76" font-weight="800" letter-spacing="-3" fill="#eef1f6">pdf2</text>
    <text x="150" y="66" font-size="76" font-weight="800" letter-spacing="-3" fill="url(#brand)">vid</text>

    <text x="2" y="108" font-size="21" font-weight="500" fill="#aeb6c6">
      Turn PDFs into narrated <tspan fill="#eef1f6" font-weight="700">read-along videos</tspan> for YouTube &amp; TikTok
    </text>

    <!-- feature chips -->
    <g transform="translate(2, 132)" font-size="13" font-weight="600" fill="#c7cedd">
      <g>
        <rect x="0" y="0" width="168" height="30" rx="15" fill="#1a2030" stroke="#28324a"/>
        <text x="18" y="20">Read-along captions</text>
      </g>
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="126" height="30" rx="15" fill="#1a2030" stroke="#28324a"/>
        <text x="18" y="20">Free by default</text>
      </g>
      <g transform="translate(318, 0)">
        <rect x="0" y="0" width="196" height="30" rx="15" fill="#1a2030" stroke="#28324a"/>
        <text x="18" y="20">Windows · macOS · Linux</text>
      </g>
      <g transform="translate(526, 0)">
        <rect x="0" y="0" width="126" height="30" rx="15" fill="#1a2030" stroke="#28324a"/>
        <text x="18" y="20">No telemetry</text>
      </g>
    </g>
  </g>

  <!-- PDF -> video illustration -->
  <g transform="translate(792, 96)">
    <!-- PDF document -->
    <g transform="translate(0, 24)">
      <rect x="0" y="0" width="118" height="150" rx="8" fill="url(#page)" stroke="#2b3550"/>
      <rect x="16" y="18" width="66" height="8" rx="3" fill="#6ea8fe"/>
      <rect x="16" y="38" width="86" height="4" rx="2" fill="#3a4560"/>
      <rect x="16" y="48" width="86" height="4" rx="2" fill="#3a4560"/>
      <rect x="16" y="58" width="70" height="4" rx="2" fill="#3a4560"/>
      <rect x="16" y="72" width="86" height="4" rx="2" fill="#313b53"/>
      <rect x="16" y="82" width="78" height="4" rx="2" fill="#313b53"/>
      <g transform="translate(16, 108)">
        <rect x="0" y="0" width="40" height="18" rx="4" fill="#e5484d"/>
        <text x="20" y="13" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#fff">PDF</text>
      </g>
    </g>

    <!-- arrow -->
    <g transform="translate(140, 96)">
      <line x1="0" y1="0" x2="46" y2="0" stroke="url(#brand)" stroke-width="4" stroke-linecap="round"/>
      <path d="M40 -8 L56 0 L40 8 Z" fill="#6ea8fe"/>
    </g>

    <!-- video frame (16:9) with play + read-along caption -->
    <g transform="translate(210, 12)">
      <rect x="0" y="0" width="196" height="174" rx="10" fill="#0e1420" stroke="#2b3550"/>
      <rect x="10" y="10" width="176" height="120" rx="6" fill="url(#page)"/>
      <!-- play button -->
      <circle cx="98" cy="70" r="26" fill="#000" opacity="0.35"/>
      <circle cx="98" cy="70" r="26" fill="none" stroke="url(#brand)" stroke-width="2.5"/>
      <path d="M90 58 L114 70 L90 82 Z" fill="#ffffff"/>
      <!-- read-along caption bar -->
      <rect x="26" y="104" width="144" height="20" rx="5" fill="#000" opacity="0.5"/>
      <rect x="34" y="111" width="60" height="6" rx="3" fill="#ffc131"/>
      <rect x="100" y="111" width="62" height="6" rx="3" fill="#6b7688"/>
      <!-- timeline -->
      <rect x="10" y="144" width="176" height="6" rx="3" fill="#1d2536"/>
      <rect x="10" y="144" width="96" height="6" rx="3" fill="url(#brand)"/>
      <circle cx="106" cy="147" r="6" fill="#eef1f6"/>
    </g>
  </g>
</svg>
