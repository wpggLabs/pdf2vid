<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="pdf2vid">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc131"/>
      <stop offset="0.55" stop-color="#f08a3c"/>
      <stop offset="1" stop-color="#6ea8fe"/>
    </linearGradient>
    <linearGradient id="play" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7df4"/>
      <stop offset="1" stop-color="#1f5fd0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="26" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- gradient tile -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="#000" opacity="0.04"/>

  <!-- document -->
  <g filter="url(#shadow)">
    <path d="M300 210 h300 l124 124 v370 a40 40 0 0 1 -40 40 H300 a40 40 0 0 1 -40 -40 V250 a40 40 0 0 1 40 -40 Z"
          fill="#ffffff"/>
    <path d="M600 210 l124 124 h-100 a24 24 0 0 1 -24 -24 Z" fill="#dfe6f2"/>
    <!-- text lines -->
    <rect x="330" y="360" width="240" height="26" rx="13" fill="#c6cfdd"/>
    <rect x="330" y="410" width="300" height="20" rx="10" fill="#d7deea"/>
    <rect x="330" y="448" width="300" height="20" rx="10" fill="#d7deea"/>
    <rect x="330" y="486" width="220" height="20" rx="10" fill="#d7deea"/>
    <!-- PDF tag -->
    <rect x="330" y="286" width="118" height="46" rx="10" fill="#e5484d"/>
    <text x="389" y="319" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff">PDF</text>
  </g>

  <!-- play badge -->
  <g filter="url(#shadow)">
    <circle cx="672" cy="672" r="150" fill="url(#play)"/>
    <circle cx="672" cy="672" r="150" fill="none" stroke="#fff" stroke-width="10" opacity="0.9"/>
    <path d="M636 604 L744 672 L636 740 Z" fill="#ffffff"/>
  </g>
</svg>
